[project]
name = "convolt"
version = "0.1.0"
description = "ConVOLT: conformal volumetry for template-based segmentation via registration."
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.22",
  "scipy>=1.8",
  "pandas>=1.5",
  "matplotlib>=3.6",
  "scikit-image>=0.20",
  "tqdm>=4.64",
]

[project.scripts]
convolt-register = "reg.cli_unified:main"
convolt-uq = "reg.uq.cli:main"
convolt-acdc = "reg.acdc_cli:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["reg*"]
exclude = ["uq_results*", "scripts*", "docs*"]
